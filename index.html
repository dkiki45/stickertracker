<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Tracker 2026</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 50px; background-color: #f2f2f7; }
        h1 { color: #1c1c1e; }
    </style>
</head>
<body>
    <h1 id="texto-pagina">Carregando a página...</h1>

    <script>
        // Pega as informações do dispositivo que está acessando
        var ua = navigator.userAgent || navigator.vendor || window.opera;

        // Verifica se é um dispositivo Apple (iPhone, iPad, iPod)
        if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
            // É um usuário real: Dispara para a App Store imediatamente!
            window.location.replace("https://apps.apple.com/app/id6764683639");
        } else {
            // É o robô do Facebook ou um PC: Mostra um texto inofensivo para ele aprovar
            document.getElementById("texto-pagina").innerText = "Bem-vindo ao site oficial do Sticker Tracker 2026! A melhor forma de organizar suas figurinhas.";
        }
    </script>
</body>
</html>
